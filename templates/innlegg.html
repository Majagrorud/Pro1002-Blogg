{% extends "base.html" %}

{% block title %}{{ innlegg["tittel"] }}{% endblock %}

{% block content %}
    <article>
        <h1>{{ innlegg["tittel"] }}</h1>
        <p>{{ innlegg["dato"] }}</p>

        <p>
            {% for tag in tagger %}
                <span class="tag">{{ tag["navn"] }}</span>
            {% endfor %}
        </p>

        <p>{{ innlegg["tekst"] }}</p>
    </article>
{% endblock %}
