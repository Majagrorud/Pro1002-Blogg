<!doctype html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Min blogg{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('forside') }}">Min blogg</a>
        <nav>
            <a href="{{ url_for('forside') }}">Hjem</a>
                  <a href="{{ url_for('nytt_innlegg') }}">+ Nytt innlegg</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
            {% for melding in get_flashed_messages() %}
            <p class="melding" role="status">{{ melding }}</p>
        {% endfor %}
</body>
</html>
