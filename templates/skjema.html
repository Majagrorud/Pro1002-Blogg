{% extends "base.html" %}

{% block title %}{{ overskrift }}{% endblock %}

{% block content %}
    <h1>{{ overskrift }}</h1>

    <form method="post">
        <p>
            <label for="tittel">Tittel</label>
            <input type="text" id="tittel" name="tittel">
        </p>
        <p>
            <label for="tekst">Tekst</label>
            <textarea id="tekst" name="tekst" rows="12"></textarea>
        </p>
                <p>
            <label for="tagger">Tagger</label>
            <input type="text" id="tagger" name="tagger" aria-describedby="tagger-hjelp">
            <small id="tagger-hjelp">Skill taggene med komma, for eksempel: hund, mat, oslo</small>
        </p>
        <button type="submit">Lagre innlegg</button>
    </form>
{% endblock %}
